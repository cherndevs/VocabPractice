<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capture</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: hsl(210, 40%, 98%);
      --foreground: hsl(222.2, 84%, 4.9%);
      --card: hsl(0, 0%, 100%);
      --primary: hsl(221.2, 83.2%, 53.3%);
      --primary-foreground: hsl(210, 40%, 98%);
      --muted: hsl(210, 40%, 96%);
      --muted-foreground: hsl(215.4, 16.3%, 46.9%);
      --border: hsl(214.3, 31.8%, 91.4%);
    }
    .dark {
      --background: hsl(222.2, 84%, 4.9%);
      --foreground: hsl(210, 40%, 98%);
      --card: hsl(222.2, 84%, 4.9%);
      --primary: hsl(217.2, 91.2%, 59.8%);
      --primary-foreground: hsl(222.2, 84%, 4.9%);
      --muted: hsl(217.2, 32.6%, 17.5%);
      --muted-foreground: hsl(215, 20.2%, 65.1%);
      --border: hsl(217.2, 32.6%, 17.5%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .icon { width: 16px; height: 16px; flex-shrink: 0; }
    .close-btn { background: none; border: none; width: 44px; height: 44px; cursor: pointer; color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; }
    .step-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); margin-left: 4px; }
    .viewfinder {
      flex: 1; margin: 16px 20px; border: 2px dashed var(--border); border-radius: 16px; background: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 24px;
    }
    .viewfinder svg { width: 44px; height: 44px; color: var(--muted-foreground); }
    .viewfinder .frame-title { font-size: 15px; font-weight: 600; color: var(--foreground); text-align: center; }
    .viewfinder .frame-sub { font-size: 13px; color: var(--muted-foreground); text-align: center; line-height: 1.4; }
    .capture-footer { display: flex; flex-direction: column; gap: 10px; padding: 8px 20px 24px; flex-shrink: 0; }
    .start-camera-btn {
      height: 46px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground);
      border: none; font-size: 15px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .skip-btn {
      height: 46px; border-radius: 8px; background: none; border: 1.5px solid var(--border);
      color: var(--foreground); font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</helmet>

<div class="{{rootClass}}" style="width: 384px; height: 720px; background: var(--background); box-shadow: 0 0 20px rgba(0,0,0,0.12); overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; padding: 16px 12px 0;">
    <button type="button" class="close-btn" aria-label="Cancel">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <span class="step-label">Step 2/6 &middot; Capture</span>
  </div>

  <div class="viewfinder">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    <div class="frame-title">Tap to capture worksheet</div>
    <div class="frame-sub">Align your worksheet within the frame to extract words</div>
  </div>

  <div class="capture-footer">
    <button type="button" class="start-camera-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      Start Camera
    </button>
    <button type="button" class="skip-btn">Skip for now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"darkMode":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { rootClass: this.props.darkMode ? 'dark' : '' };
  }
}
</script>
</body>
</html>
