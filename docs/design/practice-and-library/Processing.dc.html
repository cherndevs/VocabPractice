<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Processing</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: hsl(210, 40%, 98%);
      --foreground: hsl(222.2, 84%, 4.9%);
      --card: hsl(0, 0%, 100%);
      --primary: hsl(221.2, 83.2%, 53.3%);
      --muted: hsl(210, 40%, 96%);
      --muted-foreground: hsl(215.4, 16.3%, 46.9%);
      --border: hsl(214.3, 31.8%, 91.4%);
    }
    .dark {
      --background: hsl(222.2, 84%, 4.9%);
      --foreground: hsl(210, 40%, 98%);
      --card: hsl(222.2, 84%, 4.9%);
      --primary: hsl(217.2, 91.2%, 59.8%);
      --muted: hsl(217.2, 32.6%, 17.5%);
      --muted-foreground: hsl(215, 20.2%, 65.1%);
      --border: hsl(217.2, 32.6%, 17.5%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .icon { width: 16px; height: 16px; flex-shrink: 0; }
    .close-btn { background: none; border: none; width: 44px; height: 44px; cursor: pointer; color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; }
    .step-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); margin-left: 4px; }
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 40px; }
    .spinner {
      width: 40px; height: 40px; border-radius: 999px; border: 3px solid var(--muted); border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .processing-title { font-size: 16px; font-weight: 600; color: var(--foreground); }
    .processing-sub { font-size: 13px; color: var(--muted-foreground); text-align: center; }
  </style>
</helmet>

<div class="{{rootClass}}" style="width: 384px; height: 720px; background: var(--background); box-shadow: 0 0 20px rgba(0,0,0,0.12); overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; padding: 16px 12px 0;">
    <button type="button" class="close-btn" aria-label="Cancel">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <span class="step-label">Step 4/6 &middot; Processing</span>
  </div>

  <div class="center">
    <div class="spinner"></div>
    <div class="processing-title">Reading the worksheet&hellip;</div>
    <div class="processing-sub">This usually takes a few seconds.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"darkMode":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { rootClass: this.props.darkMode ? 'dark' : '' };
  }
}
</script>
</body>
</html>
