<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic test</title>
<style>
  body { font: 17px -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  button { font: inherit; padding: 12px 16px; margin: 4px 4px 4px 0; border-radius: 10px; border: 1px solid #888; background: #f2f2f2; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 14px; background: #f6f6f6; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<p><a href="/settings">← Back to app</a></p>
<h2>Mic test</h2>
<p>Open the app from the home-screen icon first, then come to this page. Tap a button and say the word shown.</p>
<button onclick="run('zh-CN','长城')">Chinese: 长城</button>
<button onclick="run('en-US','apple')">English: apple</button>
<p id="mode"></p>
<div id="log"></div>
<script>
  const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
  const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  document.getElementById('mode').textContent = standalone
    ? 'Running from the home screen ✓'
    : 'Running in the browser (not the home-screen app)';
  log('UA: ' + navigator.userAgent);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  log('Speech recognition API: ' + (SR ? 'present' : 'MISSING'));

  function run(lang, word) {
    if (!SR) return log('Cannot run: API missing');
    const r = new SR();
    r.lang = lang;
    r.maxAlternatives = 5;
    r.interimResults = false;
    log('\n[' + lang + '] say "' + word + '"…');
    r.onstart = () => log('listening');
    r.onresult = (e) => {
      const alts = Array.from(e.results[0]).map(a => a.transcript + ' (' + (a.confidence ?? '?') + ')');
      log('heard: ' + alts.join(' | '));
    };
    r.onerror = (e) => log('error: ' + e.error + (e.message ? ' – ' + e.message : ''));
    r.onend = () => log('ended');
    try { r.start(); } catch (err) { log('start threw: ' + err); }
  }
</script>
</body>
</html>
